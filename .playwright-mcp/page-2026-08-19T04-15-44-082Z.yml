            - paragraph [ref=f4e156]: Sim, 100% gratuita. Você descobre as teses aplicáveis, probabilidade de êxito e prazos sem pagar nada e sem precisar informar dados bancários.
          - generic [ref=f4e157]:
            - heading "O que acontece após protocolar a defesa?" [level=4] [ref=f4e158]
            - paragraph [ref=f4e159]: A defesa tempestiva suspende a exigibilidade da multa e os pontos na CNH até o julgamento pelo órgão autuador ou pela JARI.
