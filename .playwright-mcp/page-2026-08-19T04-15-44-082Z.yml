            - heading "Posso protocolar a defesa pela internet?" [level=4] [ref=f4e161]
            - paragraph [ref=f4e162]: Sim. A petição gerada pelo DefesAi segue a estrutura formal exigida para protocolo presencial, envio postal ou protocolo digital nos portais do DETRAN, PRF, DNIT e prefeituras municipais.
